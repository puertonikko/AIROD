title: Reach a target horsepower by re-tuning a vehicle, using OBD-II as feedback
goal: >
  Design a safe, methodical way to optimize a gasoline vehicle to a specific
  requested horsepower by adjusting its tuning, using the vehicle's OBD-II live
  data as the feedback signal. Determine which parameters actually reach the
  target (fuel, spark/timing, boost, VE, torque limits), which must be changed
  by re-flashing the ECU versus merely read over OBD-II, how to estimate current
  horsepower from OBD-II telemetry, and the safety limits (knock, AFR, EGT,
  thermal) and legal constraints (emissions) that bound the answer. Assume an
  off-road/track use case where emissions-legal street operation is not required.

success_criteria:
  - Correctly separates what OBD-II can READ from what must be WRITTEN by re-flashing.
  - Names the specific tuning parameters that move horsepower and their safe ranges.
  - Gives a closed-loop method to converge on the target HP from OBD-II feedback.
  - States the safety and legal limits that bound the result.

budget_usd: 5.00
stall_rounds: 2
